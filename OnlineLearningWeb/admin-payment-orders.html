<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Quản lý thanh toán - StudyLab</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="admin-dashboard.html"><span>Study</span>Lab</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
        <span class="oi oi-menu"></span> Menu
      </button>
      <div class="collapse navbar-collapse" id="ftco-nav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a href="admin-dashboard.html" class="nav-link">Dashboard</a></li>
          <li class="nav-item"><a href="login.html" class="nav-link">Đăng nhập</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="ftco-section">
    <div class="container">
      <div id="apo-alert" class="alert d-none" role="alert"></div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Quản lý thanh toán chuyển khoản</h2>
        <div>
          <select id="apo-filter-status" class="form-control form-control-sm">
            <option value="">Tất cả trạng thái</option>
            <option value="PENDING">Chờ xác nhận</option>
            <option value="PAID">Đã xác nhận</option>
          </select>
        </div>
      </div>

      <div class="table-responsive bg-white p-3 rounded shadow-sm">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Mã đơn</th>
              <th>Người dùng</th>
              <th>Tổng tiền</th>
              <th>Trạng thái</th>
              <th>Thời gian</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="apo-tbody">
            <tr><td colspan="6" class="text-muted">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-nav.js"></script>
  <script src="js/admin-guard.js"></script>
  <script src="js/admin-payment-orders.js"></script>
</body>
</html>
