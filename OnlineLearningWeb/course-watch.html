<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Xem khóa học</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/chat-widget.css" />
  <style>
    /* ~3 bài học hiển thị, phần còn lại cuộn trong khung */
    .cw-lessons-scroll {
      max-height: 13rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html"><span>Study</span>Lab</a>
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a href="course.html" class="nav-link">Khóa học</a></li>
        <li class="nav-item"><a href="login.html" class="nav-link">Đăng nhập</a></li>
      </ul>
    </div>
  </nav>

  <section class="ftco-section">
    <div class="container">
      <div id="cw-alert" class="alert d-none" role="alert"></div>
      <h3 id="cw-title" class="mb-2">Đang tải khóa học...</h3>
      <p id="cw-desc" class="text-muted mb-4"></p>

      <div class="row">
        <div class="col-md-8 mb-3">
          <!-- YouTube cần iframe; file/mp4 dùng thẻ video -->
          <div id="cw-player-wrap" class="position-relative w-100 bg-dark" style="min-height:240px;">
            <video
              id="cw-player"
              class="w-100"
              controls
              playsinline
              style="display:none;max-height:430px;background:#000;"
            ></video>
            <iframe
              id="cw-youtube"
              class="w-100"
              title="YouTube video"
              style="display:none;min-height:360px;max-height:430px;border:0;"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
              referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Danh sách bài học</h5>
              <div class="cw-lessons-scroll border rounded">
                <div id="cw-lessons" class="list-group list-group-flush"></div>
              </div>
              <button type="button" id="cw-open-quiz" class="btn btn-outline-success btn-sm btn-block mt-3" disabled>
                <span class="fa fa-pencil-square-o mr-1" aria-hidden="true"></span>
                Làm bài tập
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Trắc nghiệm & flashcard — chỉ hiện trong modal khi bấm "Làm bài tập" -->
  <div class="modal fade" id="cw-quiz-modal" tabindex="-1" role="dialog" aria-labelledby="cw-quiz-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
      <div class="modal-content border-success">
        <div class="modal-header bg-light py-3">
          <h5 class="modal-title text-success" id="cw-quiz-modal-title">Làm bài tập</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Đóng">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <small class="text-muted d-block mb-2">Điểm được lưu mỗi lần nộp bài — làm lại sẽ tạo thêm một lần làm mới.</small>
          <div id="cw-quiz-stats" class="small text-muted mb-3"></div>
          <div id="cw-quiz-content"></div>
        </div>
        <div class="modal-footer flex-wrap">
          <button type="button" id="cw-quiz-submit" class="btn btn-success" style="display: none">Nộp bài (lưu điểm)</button>
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-nav.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="js/chat-widget.js"></script>
  <script src="js/course-watch.js"></script>
</body>
</html>
