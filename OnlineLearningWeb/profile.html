<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Thông tin cá nhân - StudyLab</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/animate.css">
  <link rel="stylesheet" href="css/owl.carousel.min.css">
  <link rel="stylesheet" href="css/owl.theme.default.min.css">
  <link rel="stylesheet" href="css/magnific-popup.css">
  <link rel="stylesheet" href="css/bootstrap-datepicker.css">
  <link rel="stylesheet" href="css/jquery.timepicker.css">
  <link rel="stylesheet" href="css/flaticon.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/chat-widget.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html"><span>Study</span>Lab</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
        <span class="oi oi-menu"></span> Menu
      </button>
      <div class="collapse navbar-collapse" id="ftco-nav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="course.html" class="nav-link">Course</a></li>
          <li class="nav-item"><a href="cart.html" class="nav-link">Giỏ đăng ký</a></li>
          <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
          <li class="nav-item"><a href="login.html" class="nav-link">Đăng nhập</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="hero-wrap hero-wrap-2" style="background-image: url('images/bg_2.jpg');">
    <div class="overlay"></div>
    <div class="container">
      <div class="row no-gutters slider-text align-items-end justify-content-center">
        <div class="col-md-9 ftco-animate pb-5 text-center">
          <p class="breadcrumbs"><span class="mr-2"><a href="index.html">Home</a></span> <span>Thông tin cá nhân</span></p>
          <h1 class="mb-0 bread">Thông tin cá nhân</h1>
        </div>
      </div>
    </div>
  </section>

  <section class="ftco-section">
    <div class="container">
      <div id="profile-alert" class="alert d-none" role="alert"></div>
      <div class="row">
        <div class="col-md-4 mb-3 mb-md-0">
          <div class="card shadow-sm border-0 p-4 text-center">
            <div
              class="rounded-circle bg-light mx-auto d-flex align-items-center justify-content-center overflow-hidden"
              style="width:92px;height:92px;"
              id="pf-avatar-wrap"
            >
              <img id="pf-avatar-img" src="" alt="" class="d-none" style="width:100%;height:100%;object-fit:cover;" />
              <span class="fa fa-user" id="pf-avatar-icon" style="font-size:44px;color:#6c63ff;"></span>
            </div>

            <h4 class="mt-3 mb-1" id="pf-username">-</h4>
            <div class="text-muted small" id="pf-email">-</div>

            <div class="d-flex justify-content-center flex-wrap mt-3">
              <span class="badge badge-pill badge-primary mr-2 mb-2" id="pf-role">-</span>
              <span class="badge badge-pill badge-secondary mb-2" id="pf-status">-</span>
            </div>

            <div class="mt-4">
              <a class="btn btn-outline-primary btn-sm" href="cart.html">Giỏ hàng</a>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="card shadow-sm border-0 p-4 mb-4">
            <h5 class="mb-3">Cập nhật thông tin</h5>
            <form id="profile-form">
              <div class="form-group">
                <label for="pf-email-ro">Email</label>
                <input type="email" class="form-control bg-light" id="pf-email-ro" readonly />
                <small class="text-muted">Email không thể thay đổi.</small>
              </div>
              <div class="form-group">
                <label for="pf-username-input">Tên đăng nhập</label>
                <input type="text" class="form-control" id="pf-username-input" required autocomplete="username" />
              </div>
              <div class="form-group">
                <label for="pf-fullname">Họ và tên</label>
                <input type="text" class="form-control" id="pf-fullname" placeholder="Họ tên hiển thị" autocomplete="name" />
              </div>
              <div class="form-group">
                <label for="pf-avatar-url">Ảnh đại diện (URL)</label>
                <input type="text" class="form-control" id="pf-avatar-url" placeholder="https://..." />
              </div>
              <button type="submit" class="btn btn-primary">Lưu thông tin</button>
            </form>
          </div>

          <div class="card shadow-sm border-0 p-4">
            <h5 class="mb-3">Đổi mật khẩu</h5>
            <form id="password-form">
              <div class="form-group">
                <label for="pf-old-pass">Mật khẩu hiện tại</label>
                <input type="password" class="form-control" id="pf-old-pass" required autocomplete="current-password" />
              </div>
              <div class="form-group">
                <label for="pf-new-pass">Mật khẩu mới</label>
                <input type="password" class="form-control" id="pf-new-pass" required minlength="8" autocomplete="new-password" />
                <small class="text-muted">Tối thiểu 8 ký tự.</small>
              </div>
              <div class="form-group">
                <label for="pf-new-pass2">Nhập lại mật khẩu mới</label>
                <input type="password" class="form-control" id="pf-new-pass2" required minlength="8" autocomplete="new-password" />
              </div>
              <button type="submit" class="btn btn-outline-primary">Đổi mật khẩu</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/jquery.min.js"></script>
  <script src="js/jquery-migrate-3.0.1.min.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-nav.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="js/chat-widget.js"></script>
  <script src="js/profile-page.js"></script>
</body>
</html>
