<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Admin - Quiz / Flashcard theo bài học</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="admin-dashboard.html"><span>Study</span>Lab</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
        <span class="oi oi-menu"></span> Menu
      </button>
      <div class="collapse navbar-collapse" id="ftco-nav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a href="admin-dashboard.html" class="nav-link">Dashboard</a></li>
          <li class="nav-item"><a href="login.html" class="nav-link">Đăng nhập</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="ftco-section">
    <div class="container">
      <div id="alq-alert" class="alert d-none" role="alert"></div>
      <h3 class="mb-3">Soạn quiz &amp; flashcard cho từng bài video</h3>
      <p class="text-muted small">
        Chọn khóa học và bài học, thêm câu trắc nghiệm (MCQ) hoặc flashcard. Học viên làm bài tại trang
        <strong>Xem bài học</strong> — mỗi lần nộp lưu một bản ghi điểm (có thể làm lại nhiều lần).
      </p>

      <div class="card mb-4">
        <div class="card-body">
          <div class="form-row">
            <div class="form-group col-md-6">
              <label>Khóa học</label>
              <select id="alq-course" class="form-control">
                <option value="">-- Chọn --</option>
              </select>
            </div>
            <div class="form-group col-md-6">
              <label>Bài học (video)</label>
              <select id="alq-lesson" class="form-control" disabled>
                <option value="">-- Chọn khóa học trước --</option>
              </select>
            </div>
          </div>
          <button type="button" class="btn btn-outline-danger btn-sm" id="alq-delete-quiz" disabled>
            Xóa quiz của bài này
          </button>
        </div>
      </div>

      <div class="card" id="alq-editor" style="display: none">
        <div class="card-body">
          <h5 class="card-title">Nội dung câu hỏi</h5>
          <div id="alq-items"></div>
          <div class="mt-3">
            <button type="button" class="btn btn-sm btn-outline-primary mr-2" id="alq-add-mcq">+ Câu trắc nghiệm</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="alq-add-fc">+ Flashcard</button>
          </div>
          <button type="button" class="btn btn-success mt-4" id="alq-save">Lưu quiz</button>
        </div>
      </div>
    </div>
  </section>

  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth-nav.js"></script>
  <script src="js/admin-guard.js"></script>
  <script src="js/admin-lesson-quizzes.js"></script>
</body>
</html>
